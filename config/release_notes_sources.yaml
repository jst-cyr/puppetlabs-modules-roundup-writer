# Release Notes Source Mapping for Puppetlabs Modules
# 
# This config defines where to fetch release notes for each module.
# - forge_changelog: Fetch from Forge changelog tab (default for unlisted modules)
# - external_docs: Custom URL patterns pointing to help.puppet.com or other docs
# - manual_review: Skip automation, curator must provide notes manually

forge_changelog:
  # Most modules are listed here for clarity, but any unlisted module defaults to forge_changelog
  - accounts
  - apache
  - apt
  - augeas_core
  - chocolatey
  - concat
  - cron_core
  - dsc_lite
  - docker
  - edgeops
  - exec
  - firewall
  - haproxy
  - host_core
  - iis
  - inifile
  - java
  - java_ks
  - lvm
  - motd
  - mount_core
  - mysql
  - ntp
  - pe_event_forwarding
  - peadm
  - playbook_runner
  - postgresql
  - powershell
  - puppet_agent
  - pwshlib
  - registry
  - reboot
  - sqlserver
  - stdlib
  - tomcat
  - vcsrepo
  - xinetd
  - yumrepo_core
  - zfs_core
  - zone_core
  - influxdb

# Modules with custom external documentation sources only.
# If a module is not listed here, it should use default_source.
external_docs:
  # Security Compliance Enforcement for Linux
  # help.puppet.com versioned docs (MadCap Flare HTML)
  sce_linux:
    doc_type: "help_puppet_madcap"
    parser_type: "madcap_flare"
    base_url: "https://help.puppet.com/sce/current/linux/"
    url_pattern: "scel_relnotes_{version_underscore}.htm"
    # e.g., version 2.6.0 becomes 260 in URL: scel_relnotes_260.htm
    
  # Security Compliance Enforcement for Windows
  sce_windows:
    doc_type: "help_puppet_madcap"
    parser_type: "madcap_flare"
    base_url: "https://help.puppet.com/sce/current/windows/"
    url_pattern: "scew_relnotes_{version_underscore}.htm"
    # e.g., version 2.2.1 becomes v221 in URL: scew_relnotes_v221.htm
    version_transform: "v"  # prepend 'v' to underscore version
    
  # Continuous Delivery Modules
  # help.puppet.com fixed URL docs (MadCap Flare HTML)
  cd4peadm:
    doc_type: "help_puppet_madcap"
    parser_type: "madcap_flare"
    base_url: "https://help.puppet.com/cdpe/current/Content/UserGuide/CDPE/ReleaseNotes/"
    url_pattern: "cd_release_notes.htm"
    note: "Not version-specific; always points to current docs"
    
  # Compliance Modules (MadCap Flare HTML)
  comply:
    doc_type: "help_puppet_madcap"
    parser_type: "madcap_flare"
    base_url: "https://help.puppet.com/scm/current/Content/UserGuide/SCM/Release_notes/"
    url_pattern: "release_notes.htm"
    
  complyadm:
    doc_type: "help_puppet_madcap"
    parser_type: "madcap_flare"
    base_url: "https://help.puppet.com/scm/current/Content/UserGuide/SCM/Release_notes/"
    url_pattern: "release_notes.htm"
    
  # NOTE:
  # puppet_data_connector and puppet_operational_dashboards use Forge changelog.
  # They are intentionally omitted here so they use default_source.

# Modules requiring manual curator review
# (e.g., complex release notes, multiple sources, or judgment calls needed)
manual_review: []

# Default: If a module is not listed above, assume forge_changelog
default_source: "forge_changelog"
