# Maintained allowlist of GitHub usernames known to belong to the Puppet/Perforce
# team (i.e. the "puppetlabs" organization), for classifying roundup contributions
# as internal vs. community in scripts/05_count_contributions.py.
#
# GitHub's public API only exposes *public* org membership (most Puppet employees
# keep their puppetlabs org membership private), so this list can't be generated
# automatically and must be curated by hand. When a new/unrecognized GitHub handle
# shows up in a roundup, the script will flag it as "unknown" — look up whether the
# person is a Puppet/Perforce employee (check their GitHub profile's company field,
# whether their PRs reference internal ticket prefixes like CAT-/PE-/MODULES-, or
# just ask around) and add them to the appropriate list below.
#
# Last reviewed: 2026-08 (module releases report, 2026-01-01 to 2026-08-01)

